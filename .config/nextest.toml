# By default, retry a few times until pass the test within the specified timeout
[profile.default]
retries = 2
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.default.junit]
path = "junit.xml"

# Run the following tests exclusively with longer timeout
[[profile.default.overrides]]
filter = """
test(=zenoh_session_unicast) |
test(=zenoh_session_multicast) |
test(=zenoh_unicity_p2p) |
test(=zenoh_unicity_brokered) |
test(=transport_tcp_intermittent) |
test(=transport_tcp_intermittent_for_lowlatency_transport) |
test(=transport_unicast_quic_only_mutual_success) |
test(=transport_unicast_quic_only_server) |
test(=three_node_combination) |
test(=watchdog_alloc_concurrent) |
test(=header_check_memory_concurrent) |
test(=header_link_concurrent) |
test(=header_link_failure_concurrent) |
test(=zenoh_querier_matching_status)
"""
slow-timeout = { period = "60s", terminate-after = 6 }
threads-required = 'num-cpus'

# The SHM race tests force one interleaving each, so a retry would hide a flaky result.
# The test `nextest_filter_names_this_module` fails if the module path below goes stale.
[[profile.default.overrides]]
filter = 'test(shm::unix::race_tests::)'
retries = 0
slow-timeout = { period = "60s", terminate-after = 6 }
threads-required = 'num-cpus'

[test-groups]
serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(zenoh_querier_matching_status::)'
test-group = 'serial'

# These two tests run more than u16::MAX declare/undeclare cycles and take about 3 s each,
# so they cannot meet the 2 s limit of the `net::tests::regions` override below.
# This override has to come first: nextest takes each setting from the first match.
[[profile.default.overrides]]
filter = """
package(zenoh) and (
  test(=net::tests::regions::expr_id::should_keep_routing_declarations_after_more_than_u16_max_churn_cycles) |
  test(=net::tests::regions::expr_id::should_undeclare_an_expr_id_before_declaring_it_again)
)
"""
retries = 0
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
filter = """
package(zenoh) and test(net::tests::regions)
"""
retries = 0
slow-timeout = { period = "2s", terminate-after = 1 }
